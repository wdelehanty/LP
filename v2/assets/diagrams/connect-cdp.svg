<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 244" role="img" aria-label="Forbes Connect architecture: the site's dialogues and progressive profiling feed the BlueConic CDP, enriched by third-party data, which routes profiles into Pardot for nurture and Salesforce for routing and attribution.">
