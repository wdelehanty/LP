<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 148" role="img" aria-label="The Forbes8 lifecycle: signup to activation to engagement to retention to lifetime value, with a dashed feedback loop carrying incremental sales data back into the programs.">
<defs><marker id="ar-forbes8-lifecycle" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#3A4046" stroke-width="1.2"/></marker></defs>
<rect x="10" y="10" width="160" height="56" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="24" y="34" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Signup</text>
<path d="M170,38 L190,38" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-forbes8-lifecycle)"/>
<rect x="190" y="10" width="160" height="56" rx="2" fill="#1E2226" stroke="#F2C230" stroke-width="1.5"/>
<text x="204" y="34" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Activation</text>
<text x="204" y="52" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">first value</text>
<path d="M350,38 L370,38" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-forbes8-lifecycle)"/>
<rect x="370" y="10" width="160" height="56" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="384" y="34" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Engagement</text>
<path d="M530,38 L550,38" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-forbes8-lifecycle)"/>
<rect x="550" y="10" width="160" height="56" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="564" y="34" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Retention</text>
<path d="M710,38 L730,38" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-forbes8-lifecycle)"/>
<rect x="730" y="10" width="160" height="56" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="744" y="34" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">LTV</text>
<path d="M810,66 C810,130 90,130 90,70" fill="none" stroke="#3A4046" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#ar-forbes8-lifecycle)"/>
<text x="310" y="122" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">incremental-sales feedback loop: programs tuned on sales effect</text>
</svg>
