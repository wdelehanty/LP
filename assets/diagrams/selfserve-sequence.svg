<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 182" role="img" aria-label="The self-serve lifecycle map: onboarding, activation, and retention groups, all drawing on eight programs and twenty-nine emails staged for launch.">
<defs><marker id="ar-selfserve-sequence" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#3A4046" stroke-width="1.2"/></marker></defs>
<rect x="10" y="10" width="280" height="66" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="24" y="34" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Onboarding</text>
<text x="24" y="52" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">signup to first live campaign</text>
<path d="M290,43 L310,43" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-selfserve-sequence)"/>
<rect x="310" y="10" width="280" height="66" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="324" y="34" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Activation</text>
<text x="324" y="52" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">behaviors that predict a second</text>
<path d="M590,43 L610,43" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-selfserve-sequence)"/>
<rect x="610" y="10" width="280" height="66" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="624" y="34" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Retention + revive</text>
<text x="624" y="52" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">stalled and lapsed advertisers</text>
<rect x="10" y="120" width="880" height="50" rx="2" fill="#1E2226" stroke="#F2C230" stroke-width="1.5"/>
<text x="24" y="144" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">8 programs / 29 emails</text>
<text x="24" y="162" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">written, built, and wired end to end by one person; staged for launch</text>
<path d="M150,120 L150,76" fill="none" stroke="#3A4046" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#ar-selfserve-sequence)"/>
<path d="M450,120 L450,76" fill="none" stroke="#3A4046" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#ar-selfserve-sequence)"/>
<path d="M750,120 L750,76" fill="none" stroke="#3A4046" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#ar-selfserve-sequence)"/>
</svg>
