<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 228" role="img" aria-label="The Forbes8 lifecycle as a timeline: signup, the activation sequence in the first few days, engagement, retention, and lifetime value, with every program tuned on incremental sales.">
<defs><marker id="ar-forbes8-lifecycle" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#3A4046" stroke-width="1.2"/></marker></defs>
<text x="20" y="22" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Forbes8 lifecycle</text>
<text x="20" y="38" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">signup to lifetime value</text>
<line x1="30" y1="132" x2="870" y2="132" stroke="#3A4046" stroke-width="1"/>
<line x1="55.2" y1="122" x2="55.2" y2="142" stroke="#3A4046" stroke-width="1"/>
<text x="70" y="96" text-anchor="middle" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Signup</text>
<text x="70" y="112" text-anchor="middle" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">day zero</text>
<line x1="231.6" y1="122" x2="231.6" y2="142" stroke="#F2C230" stroke-width="2"/>
<circle cx="231.6" cy="132" r="4" fill="#F2C230"/>
<text x="231.6" y="162" text-anchor="middle" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#F2C230">Activation</text>
<text x="231.6" y="178" text-anchor="middle" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">the first few days, the sequence to first value</text>
<line x1="450.0" y1="122" x2="450.0" y2="142" stroke="#3A4046" stroke-width="1"/>
<text x="450.0" y="96" text-anchor="middle" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Engagement</text>
<text x="450.0" y="112" text-anchor="middle" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">programs across the base</text>
<line x1="651.6" y1="122" x2="651.6" y2="142" stroke="#3A4046" stroke-width="1"/>
<text x="651.6" y="162" text-anchor="middle" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Retention</text>
<text x="651.6" y="178" text-anchor="middle" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">keep them around</text>
<line x1="844.8" y1="122" x2="844.8" y2="142" stroke="#3A4046" stroke-width="1"/>
<text x="830" y="96" text-anchor="middle" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">LTV</text>
<text x="830" y="112" text-anchor="middle" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">what it all points at</text>
<text x="20" y="212" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">the incremental-sales feedback loop tuned every program on sales effect</text>
</svg>
