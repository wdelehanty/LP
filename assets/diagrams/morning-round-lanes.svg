<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-label="The morning round as swimlanes: an n8n schedule collects labeled Gmail drafts, builds one digest, Will approves with one tap, and n8n sends the draft as written and logs it.">
<defs><marker id="ar-morning-round-lanes" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#3A4046" stroke-width="1.2"/></marker></defs>
<text x="20" y="22" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">The morning round</text>
<text x="20" y="38" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">job search / n8n, gmail, and me, taking turns</text>
<rect x="20" y="56" width="860" height="86" fill="#1E2226" stroke="#2A2F34" stroke-width="1"/>
<text x="34" y="104.0" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#9AA0A6">n8n</text>
<rect x="20" y="142" width="860" height="86" fill="#15181B" stroke="#2A2F34" stroke-width="1"/>
<text x="34" y="190.0" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#9AA0A6">Gmail</text>
<rect x="20" y="228" width="860" height="86" fill="#1E2226" stroke="#2A2F34" stroke-width="1"/>
<text x="34" y="276.0" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#9AA0A6">Will</text>
<rect x="138" y="74.0" width="122" height="50" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="148" y="95.0" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">8am schedule</text>
<text x="148" y="112.0" style="font:400 9px 'IBM Plex Mono',monospace" fill="#9AA0A6">every day</text>
<rect x="290" y="160.0" width="122" height="50" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="300" y="181.0" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Labeled drafts</text>
<text x="300" y="198.0" style="font:400 9px 'IBM Plex Mono',monospace" fill="#9AA0A6">labeled only</text>
<rect x="442" y="74.0" width="122" height="50" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="452" y="95.0" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Build and send</text>
<text x="452" y="112.0" style="font:400 9px 'IBM Plex Mono',monospace" fill="#9AA0A6">one digest</text>
<rect x="594" y="246.0" width="122" height="50" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="604" y="267.0" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Approve and send</text>
<text x="604" y="284.0" style="font:400 9px 'IBM Plex Mono',monospace" fill="#9AA0A6">one tap</text>
<rect x="746" y="74.0" width="122" height="50" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="756" y="95.0" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Send the draft</text>
<text x="756" y="112.0" style="font:400 9px 'IBM Plex Mono',monospace" fill="#9AA0A6">as written, logged</text>
<path d="M260,99.0 C274.5,99.0 274.5,185.0 289,185.0" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-morning-round-lanes)"/>
<path d="M412,185.0 C426.5,185.0 426.5,99.0 441,99.0" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-morning-round-lanes)"/>
<path d="M564,99.0 C578.5,99.0 578.5,271.0 593,271.0" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-morning-round-lanes)"/>
<path d="M716,271.0 C730.5,271.0 730.5,99.0 745,99.0" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-morning-round-lanes)"/>
<text x="20" y="338" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">fails closed if the label is missing: no label, no send button</text>
</svg>
