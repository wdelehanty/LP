<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Progressive profiling: one field on the first visit, one more on the next, until the reader is a known profile that gets segmented and routed.">
<defs><marker id="ar-profiling-plate" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#3A4046" stroke-width="1.2"/></marker></defs>
<text x="20" y="34" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Progressive profiling</text>
<text x="20" y="50" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">forbes connect / one ask per visit</text>
<rect x="18" y="118" width="132" height="52" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="30" y="149" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">First visit</text>
<text x="84.0" y="190" text-anchor="middle" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">one field</text>
<path d="M150,144.0 L173,144.0" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-profiling-plate)"/>
<rect x="174" y="118" width="132" height="52" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="186" y="149" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Next visit</text>
<text x="240.0" y="190" text-anchor="middle" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">one more field</text>
<path d="M306,144.0 L329,144.0" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-profiling-plate)"/>
<rect x="330" y="118" width="132" height="52" rx="2" fill="#1E2226" stroke="#F2C230" stroke-width="1.5"/>
<text x="342" y="149" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Known profile</text>
<text x="396.0" y="190" text-anchor="middle" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">segmented, routed</text>
<text x="20" y="282" style="font:400 10.5px 'IBM Plex Mono',monospace" fill="#9AA0A6">the profile fills in over a few visits</text>
<text x="20" y="300" style="font:400 10.5px 'IBM Plex Mono',monospace" fill="#9AA0A6">nobody ever sees a long form</text>
</svg>
