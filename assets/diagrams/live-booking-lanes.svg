<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-label="Live booking as swimlanes: a caller calls in, the voice agent proposes a time, n8n checks the calendar live and books or declines, and the agent confirms on the same call.">
<defs><marker id="ar-live-booking-lanes" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#3A4046" stroke-width="1.2"/></marker></defs>
<text x="20" y="22" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Live booking</text>
<text x="20" y="38" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">stedd / the caller never waits on a callback</text>
<rect x="20" y="56" width="860" height="86" fill="#1E2226" stroke="#2A2F34" stroke-width="1"/>
<text x="34" y="104.0" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#9AA0A6">Caller</text>
<rect x="20" y="142" width="860" height="86" fill="#15181B" stroke="#2A2F34" stroke-width="1"/>
<text x="34" y="190.0" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#9AA0A6">Voice agent</text>
<rect x="20" y="228" width="860" height="86" fill="#1E2226" stroke="#2A2F34" stroke-width="1"/>
<text x="34" y="276.0" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#9AA0A6">n8n + calendar</text>
<rect x="138" y="74.0" width="122" height="50" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="148" y="95.0" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Calls in</text>
<text x="148" y="112.0" style="font:400 9px 'IBM Plex Mono',monospace" fill="#9AA0A6">after hours too</text>
<rect x="290" y="160.0" width="122" height="50" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="300" y="181.0" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Proposes a time</text>
<text x="300" y="198.0" style="font:400 9px 'IBM Plex Mono',monospace" fill="#9AA0A6">caller still on</text>
<rect x="442" y="246.0" width="122" height="50" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="452" y="267.0" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Checks calendar</text>
<text x="452" y="284.0" style="font:400 9px 'IBM Plex Mono',monospace" fill="#9AA0A6">live</text>
<rect x="594" y="246.0" width="122" height="50" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="604" y="267.0" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Books or declines</text>
<text x="604" y="284.0" style="font:400 9px 'IBM Plex Mono',monospace" fill="#9AA0A6">booked or busy</text>
<rect x="746" y="160.0" width="122" height="50" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="756" y="181.0" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Confirms live</text>
<text x="756" y="198.0" style="font:400 9px 'IBM Plex Mono',monospace" fill="#9AA0A6">or another time</text>
<path d="M260,99.0 C274.5,99.0 274.5,185.0 289,185.0" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-live-booking-lanes)"/>
<path d="M412,185.0 C426.5,185.0 426.5,271.0 441,271.0" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-live-booking-lanes)"/>
<path d="M564,271.0 L593,271.0" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-live-booking-lanes)"/>
<path d="M716,271.0 C730.5,271.0 730.5,185.0 745,185.0" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-live-booking-lanes)"/>
<text x="20" y="338" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">nightly transcript QA reviews every completed call against the founder checklist</text>
</svg>
