<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 878 318" role="img" aria-label="The outcome confirmation loop: a weekly email asks each client to confirm outcomes with a short reply grammar, and a parser applies the confirmations to leads and quotes.">
