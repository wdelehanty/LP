<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="The wardrobe system as layers: an iOS app on TestFlight, a Cloudflare Worker API beneath it, his-and-hers closet databases and an outfits database in Notion, and AI photo cataloguing at the bottom.">
<defs><marker id="ar-wardrobe-system" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#3A4046" stroke-width="1.2"/></marker></defs>
<text x="20" y="22" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">The wardrobe system</text>
<text x="20" y="38" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">what sits on what</text>
<rect x="20" y="56" width="860" height="52" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="36" y="87" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">iOS app</text>
<text x="864" y="87" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">testflight; reads and writes through the worker</text>
<rect x="20" y="116" width="860" height="52" rx="2" fill="#1E2226" stroke="#F2C230" stroke-width="1.5"/>
<text x="36" y="147" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Worker API</text>
<text x="864" y="147" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">cloudflare</text>
<rect x="20" y="176" width="860" height="52" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="36" y="207" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Notion databases</text>
<text x="864" y="207" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">closet / his: 289 items, closet / hers, outfits: 14 use contexts</text>
<rect x="20" y="236" width="860" height="52" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="36" y="267" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">AI cataloguing</text>
<text x="864" y="267" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">photo in, item out</text>
<text x="20" y="308" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">item count queried from the live database, 2026-08-31</text>
</svg>
