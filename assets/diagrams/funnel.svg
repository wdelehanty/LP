<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 264" role="img" aria-label="The funnel as two lanes: marketing captures, nurtures, and routes; sales works the lead from the outreach library and closes; the closed opportunity's contact roles come back as attribution. About 2.5x conversion improvement across capture, nurture, and routing.">
<defs><marker id="ar-funnel" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#3A4046" stroke-width="1.2"/></marker></defs>
<text x="20" y="22" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">The mechanism behind the ~2.5x</text>
<text x="20" y="38" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">forbes b2b / who does what, in order</text>
<rect x="20" y="56" width="1000" height="86" fill="#1E2226" stroke="#2A2F34" stroke-width="1"/>
<text x="34" y="104.0" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#9AA0A6">Marketing</text>
<rect x="20" y="142" width="1000" height="86" fill="#15181B" stroke="#2A2F34" stroke-width="1"/>
<text x="34" y="190.0" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#9AA0A6">Sales</text>
<rect x="138" y="74.0" width="122" height="50" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="148" y="95.0" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Capture</text>
<text x="148" y="112.0" style="font:400 9px 'IBM Plex Mono',monospace" fill="#9AA0A6">forms and pages</text>
<rect x="290" y="74.0" width="122" height="50" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="300" y="95.0" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Nurture</text>
<text x="300" y="112.0" style="font:400 9px 'IBM Plex Mono',monospace" fill="#9AA0A6">onboard, reengage</text>
<rect x="442" y="74.0" width="122" height="50" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="452" y="95.0" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Route</text>
<text x="452" y="112.0" style="font:400 9px 'IBM Plex Mono',monospace" fill="#9AA0A6">speed to lead</text>
<rect x="594" y="160.0" width="122" height="50" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="604" y="181.0" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Work the lead</text>
<text x="604" y="198.0" style="font:400 9px 'IBM Plex Mono',monospace" fill="#9AA0A6">outreach library</text>
<rect x="746" y="160.0" width="122" height="50" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="756" y="181.0" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Close</text>
<text x="756" y="198.0" style="font:400 9px 'IBM Plex Mono',monospace" fill="#9AA0A6">contact role logged</text>
<rect x="898" y="74.0" width="122" height="50" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="908" y="95.0" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Attribute</text>
<text x="908" y="112.0" style="font:400 9px 'IBM Plex Mono',monospace" fill="#9AA0A6">conservative count</text>
<path d="M260,99.0 L289,99.0" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-funnel)"/>
<path d="M412,99.0 L441,99.0" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-funnel)"/>
<path d="M564,99.0 C578.5,99.0 578.5,185.0 593,185.0" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-funnel)"/>
<path d="M716,185.0 L745,185.0" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-funnel)"/>
<path d="M868,185.0 C882.5,185.0 882.5,99.0 897,99.0" fill="none" stroke="#3A4046" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#ar-funnel)"/>
<text x="20" y="252" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">~2.5x conversion improvement across capture, nurture, and routing; dashed: attribution reads the closed opportunity</text>
</svg>
