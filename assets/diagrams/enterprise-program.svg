<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 296" role="img" aria-label="A ledger of the enterprise partner program: three advertisers pitched, three channels per program, one flagship year-end report, two product tiers in the carrier pitch, CRM-ready delivery, and zero programs run because all three stopped at the pitch stage.">
<defs><marker id="ar-enterprise-program" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#3A4046" stroke-width="1.2"/></marker></defs>
<text x="20" y="22" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Enterprise partner programs</text>
<text x="20" y="38" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">the components, and where they stopped</text>
<text x="20" y="64" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#9AA0A6">Component</text>
<text x="880" y="64" text-anchor="end" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#9AA0A6">Count</text>
<line x1="20" y1="74" x2="880" y2="74" stroke="#3A4046" stroke-width="1"/>
<text x="20" y="106" style="font:400 13px Barlow,sans-serif" fill="#E6E4DF">Advertisers pitched</text>
<text x="880" y="106" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">3</text>
<line x1="20" y1="117" x2="880" y2="117" stroke="#2A2F34" stroke-width="1"/>
<text x="20" y="138" style="font:400 13px Barlow,sans-serif" fill="#E6E4DF">Channels per program</text>
<text x="880" y="138" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">3: content, research, retargeting</text>
<line x1="20" y1="149" x2="880" y2="149" stroke="#2A2F34" stroke-width="1"/>
<text x="20" y="170" style="font:400 13px Barlow,sans-serif" fill="#E6E4DF">Flagship deliverable</text>
<text x="880" y="170" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">1: a year-end insight report</text>
<line x1="20" y1="181" x2="880" y2="181" stroke="#2A2F34" stroke-width="1"/>
<text x="20" y="202" style="font:400 13px Barlow,sans-serif" fill="#E6E4DF">Product tiers, carrier pitch</text>
<text x="880" y="202" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">2</text>
<line x1="20" y1="213" x2="880" y2="213" stroke="#2A2F34" stroke-width="1"/>
<text x="20" y="234" style="font:400 13px Barlow,sans-serif" fill="#E6E4DF">Delivery</text>
<text x="880" y="234" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">CRM-ready, workable the same week</text>
<line x1="20" y1="245" x2="880" y2="245" stroke="#2A2F34" stroke-width="1"/>
<line x1="20" y1="248" x2="880" y2="248" stroke="#F2C230" stroke-width="1"/>
<text x="20" y="270" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#F2C230">Programs that ran</text>
<text x="880" y="270" text-anchor="end" style="font:400 12px 'IBM Plex Mono',monospace" fill="#F2C230">0: all three stopped at the pitch</text>
