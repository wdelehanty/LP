<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="Forbes Connect as layers: the site's dialogues and progressive profiling on top, the BlueConic CDP beneath with 18 million plus profiles, then Pardot for nurture and Salesforce for routing and attribution.">
<defs><marker id="ar-connect-cdp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#3A4046" stroke-width="1.2"/></marker></defs>
<text x="20" y="22" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Forbes Connect, what sits on what</text>
<text x="20" y="38" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">the conversion layer on the cdp</text>
<rect x="20" y="56" width="860" height="52" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="36" y="87" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Forbes.com</text>
<text x="864" y="87" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">dialogues and progressive profiling, targeted by what the reader has read and done</text>
<rect x="20" y="116" width="860" height="52" rx="2" fill="#1E2226" stroke="#F2C230" stroke-width="1.5"/>
<text x="36" y="147" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">BlueConic CDP</text>
<text x="864" y="147" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">18m+ profiles, behavioral segments, predictive ltv, third-party enrichment</text>
<rect x="20" y="176" width="860" height="52" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="36" y="207" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Pardot</text>
<text x="864" y="207" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">nurture programs; a new profile lands here without anyone touching it</text>
<rect x="20" y="236" width="860" height="52" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="36" y="267" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Salesforce</text>
<text x="864" y="267" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">routing to sellers, contact-role attribution</text>
<text x="20" y="308" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">yellow outline: the layer I own end to end; anonymous readers become identified profiles on site and route down</text>
</svg>
