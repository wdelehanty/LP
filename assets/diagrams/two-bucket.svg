<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="The two-bucket contractor model as a before and after: undifferentiated contractor work becomes trainable execution through custom GPTs and one operator, with real expertise bought at outside rates.">
<defs><marker id="ar-two-bucket" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#3A4046" stroke-width="1.2"/></marker></defs>
<text x="20" y="22" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">The two-bucket model</text>
<text x="20" y="38" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">operating playbook / who does what</text>
<line x1="240" y1="80" x2="240" y2="280" stroke="#3A4046" stroke-width="1"/>
<path d="M226,180 L253,180" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-two-bucket)"/>
<rect x="218" y="168" width="44" height="24" fill="#1E2226"/>
<path d="M228,180 L251,180" fill="none" stroke="#F2C230" stroke-width="1" marker-end="url(#ar-two-bucket)"/>
<text x="24" y="102" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#9AA0A6">One bucket</text>
<text x="24" y="128" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">contractor work,</text>
<text x="24" y="144" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">undifferentiated</text>
<text x="264" y="102" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Two buckets</text>
<text x="264" y="128" style="font:400 10px 'IBM Plex Mono',monospace" fill="#E6E4DF">trainable execution:</text>
<text x="264" y="144" style="font:400 10px 'IBM Plex Mono',monospace" fill="#E6E4DF">custom gpts, one operator</text>
<text x="264" y="160" style="font:400 10px 'IBM Plex Mono',monospace" fill="#E6E4DF">real expertise:</text>
