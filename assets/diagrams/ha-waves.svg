<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 118" role="img" aria-label="The Home Assistant cleanup in three waves: naming conventions, consolidated integrations with old hardware retired, and automations including the goodnight lockdown and doorbell chime, with maintenance events posting to Notion through a webhook.">
<defs><marker id="ar-ha-waves" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#3A4046" stroke-width="1.2"/></marker></defs>
<rect x="10" y="10" width="214" height="62" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="24" y="34" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Wave 2 / naming</text>
<text x="24" y="52" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">one scheme, every device</text>
<path d="M224,41 L232,41" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-ha-waves)"/>
<rect x="232" y="10" width="214" height="62" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="246" y="34" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Wave 3 / integrations</text>
<text x="246" y="52" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">consolidated, old gear retired</text>
<path d="M446,41 L454,41" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-ha-waves)"/>
<rect x="454" y="10" width="214" height="62" rx="2" fill="#1E2226" stroke="#F2C230" stroke-width="1.5"/>
<text x="468" y="34" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Wave 4 / automations</text>
<text x="468" y="52" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">goodnight lockdown, doorbell chime</text>
<rect x="700" y="10" width="190" height="62" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="714" y="34" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Notion log</text>
<text x="714" y="52" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">maintenance events</text>
<path d="M668,41 L700,41" fill="none" stroke="#3A4046" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#ar-ha-waves)"/>
<text x="10" y="106" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">dashed: maintenance events post themselves through the n8n webhook; the dashboard stays in the house</text>
</svg>
