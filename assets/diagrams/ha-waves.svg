<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 228" role="img" aria-label="The Home Assistant cleanup as a timeline: wave two naming, wave three consolidated integrations with old hardware retired, wave four automations including the goodnight lockdown and doorbell chime.">
<defs><marker id="ar-ha-waves" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#3A4046" stroke-width="1.2"/></marker></defs>
<text x="20" y="22" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Home Assistant, three waves</text>
<text x="20" y="38" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">the cleanup, in order</text>
<line x1="30" y1="132" x2="870" y2="132" stroke="#3A4046" stroke-width="1"/>
<line x1="114.0" y1="122" x2="114.0" y2="142" stroke="#3A4046" stroke-width="1"/>
<text x="114.0" y="96" text-anchor="middle" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Wave 2</text>
<text x="114.0" y="112" text-anchor="middle" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">naming: one scheme, every device</text>
<line x1="408.0" y1="122" x2="408.0" y2="142" stroke="#3A4046" stroke-width="1"/>
<text x="408.0" y="162" text-anchor="middle" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Wave 3</text>
<text x="408.0" y="178" text-anchor="middle" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">integrations consolidated, old gear retired</text>
<line x1="718.8" y1="122" x2="718.8" y2="142" stroke="#F2C230" stroke-width="2"/>
<circle cx="718.8" cy="132" r="4" fill="#F2C230"/>
<text x="718.8" y="96" text-anchor="middle" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#F2C230">Wave 4</text>
<text x="718.8" y="112" text-anchor="middle" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">automations: goodnight lockdown, doorbell chime</text>
<text x="20" y="212" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">maintenance events post themselves to Notion through the n8n webhook; the dashboard stays in the house</text>
</svg>
