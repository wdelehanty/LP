<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Self-serve onboarding: account creation starts the onboarding sequence toward a first live campaign, then activation programs push the behaviors that predict a second campaign.">
<defs><marker id="ar-selfserve-onboarding" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#3A4046" stroke-width="1.2"/></marker></defs>
<text x="20" y="34" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Onboarding into activation</text>
<text x="20" y="50" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">self-serve / no account manager</text>
<rect x="18" y="118" width="132" height="52" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="30" y="149" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Account created</text>
<text x="84.0" y="190" text-anchor="middle" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">onboarding</text>
<text x="84.0" y="204" text-anchor="middle" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">sequence starts</text>
<path d="M150,144.0 L173,144.0" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-selfserve-onboarding)"/>
<rect x="174" y="118" width="132" height="52" rx="2" fill="#1E2226" stroke="#F2C230" stroke-width="1.5"/>
<text x="186" y="149" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">First campaign</text>
<text x="240.0" y="190" text-anchor="middle" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">the onboarding goal</text>
<path d="M306,144.0 L329,144.0" fill="none" stroke="#3A4046" stroke-width="1" marker-end="url(#ar-selfserve-onboarding)"/>
<rect x="330" y="118" width="132" height="52" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="342" y="149" style="font:600 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase" fill="#E6E4DF">Second campaign</text>
<text x="396.0" y="190" text-anchor="middle" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">activation pushes</text>
<text x="396.0" y="204" text-anchor="middle" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">the behaviors</text>
<text x="396.0" y="218" text-anchor="middle" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">that predict it</text>
<text x="20" y="282" style="font:400 10.5px 'IBM Plex Mono',monospace" fill="#9AA0A6">what an account manager would do, built in before launch</text>
</svg>
