<text x="20" y="202" style="font:400 13px Barlow,sans-serif" fill="#E6E4DF">Knowledge base</text>
<text x="880" y="202" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">decisions and lessons</text>
<line x1="20" y1="213" x2="880" y2="213" stroke="#2A2F34" stroke-width="1"/>
<text x="20" y="234" style="font:400 13px Barlow,sans-serif" fill="#E6E4DF">Money and direction</text>
<text x="880" y="234" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">monthly, not weekly</text>
<line x1="20" y1="245" x2="880" y2="245" stroke="#2A2F34" stroke-width="1"/>
<text x="20" y="266" style="font:400 13px Barlow,sans-serif" fill="#E6E4DF">Logs</text>
<text x="880" y="266" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">maintenance, dog, builds</text>
