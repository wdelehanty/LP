<text x="20" y="106" style="font:400 13px Barlow,sans-serif" fill="#E6E4DF">Now</text>
<text x="880" y="106" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">project queue, stalest on top</text>
<line x1="20" y1="117" x2="880" y2="117" stroke="#2A2F34" stroke-width="1"/>
<text x="20" y="138" style="font:400 13px Barlow,sans-serif" fill="#E6E4DF">Capture inbox</text>
<text x="880" y="138" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">title only, keep moving</text>
<line x1="20" y1="149" x2="880" y2="149" stroke="#2A2F34" stroke-width="1"/>
<text x="20" y="170" style="font:400 13px Barlow,sans-serif" fill="#E6E4DF">Weekly review</text>
<text x="880" y="170" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">sundays, 15 minutes</text>
