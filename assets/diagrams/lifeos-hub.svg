<rect x="232" y="100" width="214" height="62" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="246" y="124" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Capture inbox</text>
<text x="246" y="142" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">title only, keep moving</text>
<path d="M339,100 L339,64" fill="none" stroke="#3A4046" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#ar-lifeos-hub)"/>
<rect x="454" y="100" width="214" height="62" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="468" y="124" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Weekly review</text>
<text x="468" y="142" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">sundays, 15 minutes</text>
<path d="M561,100 L561,64" fill="none" stroke="#3A4046" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#ar-lifeos-hub)"/>
<rect x="676" y="100" width="214" height="62" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="690" y="124" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Knowledge base</text>
<text x="690" y="142" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">decisions + lessons</text>
<path d="M783,100 L783,64" fill="none" stroke="#3A4046" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#ar-lifeos-hub)"/>
<rect x="10" y="190" width="214" height="62" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="24" y="214" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Money + direction</text>
<text x="24" y="232" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">monthly, not weekly</text>
<rect x="232" y="190" width="214" height="62" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="246" y="214" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Logs</text>
<text x="246" y="232" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">maintenance / dog / builds</text>
<rect x="454" y="190" width="214" height="62" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="468" y="214" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Parked</text>
<text x="468" y="232" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">nothing gets deleted</text>
<rect x="676" y="190" width="214" height="62" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="690" y="214" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Operating manual</text>
<text x="690" y="232" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">read when away</text>
<rect x="10" y="310" width="240" height="52" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="24" y="334" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Email label</text>
<text x="24" y="352" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">to the inbox</text>
<path d="M130,310 C234.5,310 234.5,162 339,162" fill="none" stroke="#3A4046" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#ar-lifeos-hub)"/>
<rect x="330" y="310" width="240" height="52" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="344" y="334" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Home Assistant</text>
<text x="344" y="352" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">to the maintenance log</text>
<path d="M450,310 C394.5,310 394.5,252 339,252" fill="none" stroke="#3A4046" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#ar-lifeos-hub)"/>
<rect x="650" y="310" width="240" height="52" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="664" y="334" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Webhook</text>
<text x="664" y="352" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">to the knowledge base</text>
<path d="M770,310 C776.5,310 776.5,162 783,162" fill="none" stroke="#3A4046" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#ar-lifeos-hub)"/>
<text x="10" y="396" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">capture hooks run through n8n; mapped from the live workspace, family surfaces left off on purpose</text>
</svg>
