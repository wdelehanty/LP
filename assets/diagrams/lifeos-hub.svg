<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" role="img" aria-label="A ledger of the Life OS hub in Notion: a now queue, capture inbox, weekly review, knowledge base, money and direction, logs, parked items, and the operating manual, with email, Home Assistant, and webhook capture hooks feeding in through n8n.">
<defs><marker id="ar-lifeos-hub" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#3A4046" stroke-width="1.2"/></marker></defs>
<text x="20" y="22" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Life OS hub</text>
<text x="20" y="38" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">notion / one page runs it; family surfaces left off on purpose</text>
<text x="20" y="64" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#9AA0A6">Surface</text>
<text x="880" y="64" text-anchor="end" style="font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#9AA0A6">What it holds</text>
