<text x="20" y="298" style="font:400 13px Barlow,sans-serif" fill="#E6E4DF">Parked</text>
<text x="880" y="298" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">nothing gets deleted</text>
<line x1="20" y1="309" x2="880" y2="309" stroke="#2A2F34" stroke-width="1"/>
<text x="20" y="330" style="font:400 13px Barlow,sans-serif" fill="#E6E4DF">Operating manual</text>
<text x="880" y="330" text-anchor="end" style="font:400 11px 'IBM Plex Mono',monospace" fill="#9AA0A6">read when away</text>
<line x1="20" y1="341" x2="880" y2="341" stroke="#2A2F34" stroke-width="1"/>
<line x1="20" y1="344" x2="880" y2="344" stroke="#F2C230" stroke-width="1"/>
<text x="20" y="366" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#F2C230">Capture hooks</text>
<text x="880" y="366" text-anchor="end" style="font:400 12px 'IBM Plex Mono',monospace" fill="#F2C230">email label, home assistant, webhook, all through n8n</text>
