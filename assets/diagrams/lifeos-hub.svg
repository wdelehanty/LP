<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 408" role="img" aria-label="Map of the Life OS hub in Notion: a now queue, capture inbox, weekly review, and knowledge base on the active row; money, logs, parked items, and the operating manual behind them; email, Home Assistant, and webhook capture hooks feeding in through n8n.">
<defs><marker id="ar-lifeos-hub" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#3A4046" stroke-width="1.2"/></marker></defs>
<rect x="280" y="10" width="340" height="50" rx="2" fill="#1E2226" stroke="#F2C230" stroke-width="1.5"/>
<text x="294" y="34" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Life OS hub</text>
<text x="294" y="52" style="font:400 10px 'IBM Plex Mono',monospace" fill="#9AA0A6">notion, one page runs it</text>
<rect x="10" y="100" width="214" height="62" rx="2" fill="#1E2226" stroke="#3A4046" stroke-width="1"/>
<text x="24" y="124" style="font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase" fill="#E6E4DF">Now</text>
