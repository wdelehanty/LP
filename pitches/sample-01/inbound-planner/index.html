      Acme

  );
}


// ============================================================

// ============================================================
const BRAND_COLORS = {
  'tmobile.com': '#E20074',
  'libertymutual.com': '#FFD000',
  'jetblue.com': '#0033A0',
  'wayfair.com': '#7B189F',
  'sofi.com': '#00A0DF',

  'usaa.com': '#00417C',
  'discover.com': '#FF6E1F',
  'progressive.com': '#0046A4',
  'allstate.com': '#011E41',
  'capitalone.com': '#D03027',
  'chase.com': '#117ACA',
  'cigna.com': '#0070C0',
  'humana.com': '#79B928',
  'wellsfargo.com': '#D71E28',
};

function brandNameFromDomain(domain) {
  if (!domain) return '';
  const stem = domain.split('.')[0];
  const overrides = {
    'tmobile': 'T-Mobile', 'libertymutual': 'Liberty Mutual', 'jetblue': 'JetBlue',
    'wayfair': 'Wayfair', 'sofi': 'SoFi', 'verizon': 'Verizon', 'usaa': 'USAA',
    'discover': 'Discover', 'progressive': 'Progressive', 'allstate': 'Allstate',
    'capitalone': 'Capital One', 'chase': 'Chase', 'cigna': 'Cigna',
    'humana': 'Humana', 'wellsfargo': 'Wells Fargo',
  };
  return overrides[stem] || stem.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function BrandLogo({ domain, name, size = 32, style = {}, mono = false, light = false, className = '' }) {
  const [srcIdx, setSrcIdx] = useState(0);
  const sources = [
    `https://logo.clearbit.com/${domain}`,
    `https://www.google.com/s2/favicons?domain=${domain}&sz=128`,
    `https://icons.duckduckgo.com/ip3/${domain}.ico`,
  ];
  const displayName = name || brandNameFromDomain(domain);

  if (srcIdx >= sources.length) {
    const color = light ? '#FFFFFF' : (mono ? '#000000' : (BRAND_COLORS[domain] || '#0A0A0A'));
    return (
      <span className={className} style={{
        fontFamily: "'DM Sans', sans-serif",
        fontWeight: 700, fontSize: size * 0.6, lineHeight: 1,
        letterSpacing: '-0.02em', color,
        display: 'inline-flex', alignItems: 'center', height: size,
        ...style,
      }}>{displayName}</span>
    );
  }
  return (
    <img
      key={srcIdx}
      className={className}
      src={sources[srcIdx]}
      alt={displayName}
      onError={() => setSrcIdx(srcIdx + 1)}
      style={{
        height: size, maxWidth: size * 4, objectFit: 'contain',
        filter: mono ? 'grayscale(1) contrast(1.2)' : 'none',
        ...style,
      }}
    />
  );
}

function App() {
  const [step, setStep] = useState('hero');
  const [domain, setDomain] = useState('');
  const [companyName, setCompanyName] = useState('');
  const [logoUrl, setLogoUrl] = useState('');
  const [logoOk, setLogoOk] = useState(true);
  const [goal, setGoal] = useState('');
  const [budget, setBudget] = useState('');
  const [industry, setIndustry] = useState('');
  const [plan, setPlan] = useState(null);
  const [email, setEmail] = useState('');
  const [contactName, setContactName] = useState('');
  const [unlocked, setUnlocked] = useState(false);

  const cleanDomain = (d) => d.toLowerCase().trim()
    .replace(/^https?:\/\//, '').replace(/^www\./, '')
    .split('/')[0].replace(/\s/g, '');

  const startWithBrand = (brandDomain, brandName) => {
    const d = cleanDomain(brandDomain);
    setDomain(d);
    setLogoUrl(`https://logo.clearbit.com/${d}`);
    setCompanyName(brandName || d.split('.')[0].replace(/\b\w/g, c => c.toUpperCase()));
    setLogoOk(true);
    setStep('questions');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const handleDomainSubmit = () => {
    if (!domain.trim()) return;
    const d = cleanDomain(domain);
    const matched = SAMPLE_BRANDS.find(b => b.domain === d);
    setDomain(d);
    setLogoUrl(`https://logo.clearbit.com/${d}`);
    setCompanyName(matched ? matched.name : d.split('.')[0].split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '));
    setLogoOk(true);
    setStep('questions');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const generatePlan = () => {
    setStep('generating');
    setTimeout(() => {
      const matched = PLANS[domain];
      setPlan(matched || generateTemplatedPlan(companyName, industry, goal));
      setStep('plan');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 4500);
  };

  const reset = () => {
    setStep('hero'); setDomain(''); setCompanyName(''); setLogoUrl('');
    setGoal(''); setBudget(''); setIndustry(''); setPlan(null);
    setEmail(''); setContactName(''); setUnlocked(false); setLogoOk(true);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  return (
    <>
      <div className="app-content" style={{ minHeight: '100vh' }}>
        <Header reset={reset} />
        {step === 'hero' && <Hero domain={domain} setDomain={setDomain} onSubmit={handleDomainSubmit} startWithBrand={startWithBrand} />}
        {step === 'questions' && (
          <Questions
            companyName={companyName} domain={domain}
            logoUrl={logoUrl} logoOk={logoOk} setLogoOk={setLogoOk}
            industry={industry} setIndustry={setIndustry}
            goal={goal} setGoal={setGoal}
            budget={budget} setBudget={setBudget}
            onGenerate={generatePlan}
          />
        )}
        {step === 'generating' && <Generating companyName={companyName} />}
        {step === 'plan' && plan && (
          <PlanView
            plan={plan} companyName={companyName} domain={domain}
            logoUrl={logoUrl} logoOk={logoOk}
            unlocked={unlocked} setUnlocked={setUnlocked}
            email={email} setEmail={setEmail}
            contactName={contactName} setContactName={setContactName}
            reset={reset}
          />
        )}
        <Footer />
      </div>
      {plan && (
        <PrintablePlan plan={plan} companyName={companyName} domain={domain} logoUrl={logoUrl} contactName={contactName} />
      )}
    </>
  );
}

function LiveAudienceStrip() {
  const messages = [
    { count: '847,221', label: 'conversations resolved by Acme AI today' },
    { count: '12,408', label: 'live agents on Copilot right now' },
    { count: '94,712', label: 'auto-QA evaluations in the last hour' },
    { count: '38,604', label: 'calls deflected from queue this hour' },
    { count: '6,128', label: 'compliance flags surfaced this week' },
  ];
  const [idx, setIdx] = useState(0);
  const [bumps, setBumps] = useState(0);

  useEffect(() => {
    const i = setInterval(() => {
      setIdx(p => (p + 1) % messages.length);
      setBumps(b => b + Math.floor(Math.random() * 7) + 3);
    }, 2800);
    return () => clearInterval(i);
  }, []);

  const baseCount = parseInt(messages[idx].count.replace(',', ''));
  const liveCount = (baseCount + bumps).toLocaleString();

  return (
    <div style={{ background: '#0A0A0A', color: '#F8F6F2', padding: '8px 32px', fontSize: 12, display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid #1A1A1A' }}>

        <span style={{ width: 1, height: 14, background: 'rgba(248,246,242,0.2)' }} />
        <span key={idx} className="ticker-fade" style={{ fontSize: 12, opacity: 0.9 }}>
          <strong style={{ color: '#fff' }}>{liveCount}</strong> {messages[idx].label}
        </span>
      </div>
      <div className="audience-strip-meta" style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.22em', opacity: 0.45 }}>
        $100M+ ARR · 60%+ containment · Intuit · Hilton · CarMax · Cox

    </div>
  );
}

// MATCH SCORE RING - animated SVG circular progress
// ============================================================
function MatchScore({ score = 92 }) {
  const [shown, setShown] = useState(0);

  useEffect(() => {
    const start = Date.now();
    const dur = 1800;
    let raf;
    const tick = () => {
      const t = Math.min((Date.now() - start) / dur, 1);
      const eased = 1 - Math.pow(1 - t, 3);
      setShown(Math.floor(score * eased));
      if (t < 1) raf = requestAnimationFrame(tick);
      else setShown(score);
    };
    const delay = setTimeout(() => { raf = requestAnimationFrame(tick); }, 350);
    return () => { clearTimeout(delay); if (raf) cancelAnimationFrame(raf); };
  }, [score]);

  const r = 72;
  const c = 2 * Math.PI * r;
  const offset = c - (shown / 100) * c;

  const tier =
    score >= 95 ? "An exceptional fit. Top 3% we've modeled this quarter."
    : score >= 90 ? "One of the strongest matches we've seen this quarter."
    : score >= 85 ? "A strong, defensible audience match."
    : "A solid foundation worth building on.";

  return (
    <div className="grid-2" style={{ display: 'grid', gridTemplateColumns: '180px 1fr', gap: 32, alignItems: 'center', marginTop: 36, padding: 28, border: '1px solid var(--ink)', background: '#fff' }}>
      <div style={{ position: 'relative', width: 180, height: 180 }}>
        <svg viewBox="0 0 180 180" style={{ width: '100%', height: '100%', transform: 'rotate(-90deg)' }}>
          <circle cx="90" cy="90" r={r} stroke="var(--rule)" strokeWidth="6" fill="none" />
          <circle cx="90" cy="90" r={r} stroke="var(--red)" strokeWidth="6" fill="none"
            strokeDasharray={c} strokeDashoffset={offset}
            strokeLinecap="round" />
        </svg>
        <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
          <div className="display" style={{ fontSize: 56, fontWeight: 400, lineHeight: 1, letterSpacing: '-0.04em' }}>
            {shown}<span style={{ fontSize: 22, color: 'var(--muted)', fontWeight: 300 }}>%</span>
          </div>
          <div style={{ fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.26em', color: 'var(--muted)', marginTop: 6, fontWeight: 700 }}>match</div>
        </div>
      </div>
      <div>
        <div style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.22em', color: 'var(--red)', fontWeight: 700, marginBottom: 12 }}>
          ◆ Audience match score
        </div>
        <div className="display" style={{ fontSize: 28, fontWeight: 500, lineHeight: 1.2, letterSpacing: '-0.015em' }}>
          {tier}
        </div>
        <div style={{ fontSize: 12, color: 'var(--muted)', marginTop: 12, fontStyle: 'italic' }}>
          Modeled on public customer outcomes and industry benchmarks · {new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// ANIMATED COUNT-UP STAT
// ============================================================
function AnimatedStat({ value, style = {}, className = '', delay = 600 }) {
  const match = String(value).match(/^([\d,.]+)(.*)$/);
  const target = match ? parseFloat(match[1].replace(/,/g, '')) : 0;
  const suffix = match ? match[2] : '';
  const decimals = match && match[1].includes('.') ? match[1].split('.')[1].length : 0;

  const [current, setCurrent] = useState(0);

  useEffect(() => {
    const start = Date.now();
    const dur = 1800;
    let raf;
    const tick = () => {
      const t = Math.min((Date.now() - start) / dur, 1);
      const eased = 1 - Math.pow(1 - t, 3);
      setCurrent(target * eased);
      if (t < 1) raf = requestAnimationFrame(tick);
      else setCurrent(target);
    };
    const t = setTimeout(() => { raf = requestAnimationFrame(tick); }, delay);
    return () => { clearTimeout(t); if (raf) cancelAnimationFrame(raf); };
  }, [target, delay]);

  const display = decimals > 0 ? current.toFixed(decimals) : Math.floor(current).toLocaleString();
  return <span className={className} style={style}>{display}{suffix}</span>;
}

        {/* Milestones */}
        <div className="grid-3 roadmap-grid" style={{ display: 'grid', gridTemplateColumns: `repeat(${milestones.length}, 1fr)`, gap: 0, position: 'relative' }}>
          {milestones.map((m, i) => {
            const milestoneProgress = Math.max(0, Math.min(1, progress * milestones.length - i));
            return (
              <div key={i} className="roadmap-milestone" style={{ padding: '0 12px', position: 'relative' }}>
                <div className="roadmap-dot" style={{
                  width: 18, height: 18, borderRadius: '50%',
                  background: milestoneProgress > 0.5 ? 'var(--red)' : '#fff',
                  border: '2px solid var(--ink)',
                  margin: '20px auto 0',
                  position: 'relative', zIndex: 2,
                  transition: 'background 0.3s',
                }} />
                <div style={{ marginTop: 18, textAlign: 'center' }}>

                    {m.label}
                  </div>
                  <div style={{ fontSize: 12, color: 'var(--muted)', lineHeight: 1.5 }}>{m.detail}</div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// CHANNEL COMPARISON - Acme AI vs Live Agent vs BPO
// ============================================================
function ChannelComparison({ comparison, totalImpressions }) {
  if (!comparison) return null;
  const max = Math.max(comparison.observe, comparison.linkedin, comparison.googleDisplay);
  const channels = [
    { name: 'Acme Voice AI', cost: comparison.observe, color: 'var(--red)', isWinner: true, note: 'This plan' },
    { name: 'Live Agent (in-house)', cost: comparison.linkedin, color: '#1A1A1A', note: `${(comparison.linkedin / comparison.observe).toFixed(1)}× more` },
    { name: 'Outsourced BPO', cost: comparison.googleDisplay, color: '#1A1A1A', note: `${(comparison.googleDisplay / comparison.observe).toFixed(1)}× more` },
  ];
  return (
    <div style={{ padding: '60px 0', borderBottom: '1px solid var(--ink)' }}>
      <div className="editorial-row" style={{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 60, marginBottom: 36 }}>
        <div style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.22em', fontWeight: 700 }}>Cost per call</div>
        <div>
          <div className="display" style={{ fontSize: 36, fontWeight: 500, lineHeight: 1.05, letterSpacing: '-0.02em' }}>
            The same conversation, <em style={{ color: 'var(--red)' }}>by channel.</em>
          </div>
          <div style={{ marginTop: 12, fontSize: 15, color: 'var(--muted)', lineHeight: 1.6 }}>
            Cost to handle a single Tier 1 inbound call across automation and human routes. Acme AI scales without the headcount math.
          </div>
        </div>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 60 }} className="editorial-row">
        <div></div>
        <div style={{ display: 'grid', gap: 18 }}>
          {channels.map((ch, i) => {
            const pct = (ch.cost / max) * 100;
            return (
              <div key={i} className="reveal-fast" style={{ animationDelay: `${i * 0.12}s` }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 8 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <span style={{ fontSize: 15, fontWeight: ch.isWinner ? 700 : 500, color: 'var(--ink)' }}>{ch.name}</span>
                    {ch.isWinner && (
                      <span style={{ background: 'var(--red)', color: '#fff', fontSize: 9, padding: '3px 8px', textTransform: 'uppercase', letterSpacing: '0.18em', fontWeight: 700 }}>
                        Best value
                      </span>
                    )}
                  </div>
                  <div style={{ fontSize: 11, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.16em', fontWeight: 600 }}>
                    {ch.note}
                  </div>
                </div>
                <div style={{ position: 'relative', height: 44, background: 'var(--rule)' }}>
                  <BarFill pct={pct} color={ch.color} delay={i * 200} />
                  <div style={{
                    position: 'absolute', right: 14, top: 0, bottom: 0,
                    display: 'flex', alignItems: 'center',
                    fontFamily: "'Instrument Serif', Georgia, serif",
                    fontSize: 22, fontWeight: 500, color: 'var(--ink)',
                    letterSpacing: '-0.02em',
                  }}>
                    ${ch.cost.toFixed(2)}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function BarFill({ pct, color, delay = 0 }) {
  const [width, setWidth] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setWidth(pct), delay + 200);
    return () => clearTimeout(t);
  }, [pct, delay]);
  return (
    <div style={{
      height: '100%', width: `${width}%`, background: color,
      transition: 'width 1.4s cubic-bezier(0.2, 0.8, 0.2, 1)',
    }} />
  );
}

function FauxCalendly({ companyName }) {
  // Realistic Calendly-style picker - shows next 5 weekdays + time slots
  const [selectedDay, setSelectedDay] = useState(0);
  const [selectedSlot, setSelectedSlot] = useState(null);
  const [confirmed, setConfirmed] = useState(false);

  const days = [];
  const today = new Date();
  let d = new Date(today);
  d.setDate(d.getDate() + 1);
  while (days.length < 5) {
    if (d.getDay() !== 0 && d.getDay() !== 6) days.push(new Date(d));
    d.setDate(d.getDate() + 1);
  }

  const slots = [
    ['9:00 AM', '10:30 AM', '11:00 AM'],
    ['9:30 AM', '1:00 PM', '2:30 PM', '3:00 PM'],
    ['10:00 AM', '11:30 AM', '2:00 PM'],
    ['9:00 AM', '10:00 AM', '11:00 AM', '3:30 PM'],
    ['1:30 PM', '2:00 PM', '4:00 PM'],
  ];

  if (confirmed) {
    return (
      <div style={{ padding: '60px 32px', textAlign: 'center', background: 'var(--cream)' }}>
        <div style={{ fontSize: 48, marginBottom: 16 }}>✓</div>
        <div className="display" style={{ fontSize: 32, fontWeight: 500, marginBottom: 8 }}>You're booked.</div>
        <div style={{ fontSize: 15, color: 'var(--muted)' }}>
          {days[selectedDay].toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })} · {slots[selectedDay][selectedSlot]}
        </div>
        <div style={{ fontSize: 13, color: 'var(--muted)', marginTop: 12 }}>
          Confirmation sent. Calendar invite incoming.
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: 'grid', gridTemplateColumns: '280px 1fr', minHeight: 360 }} className="grid-2">
      <div style={{ borderRight: '1px solid var(--rule)', padding: 24 }}>
        <div className="display" style={{ fontSize: 20, fontWeight: 500, marginBottom: 6 }}>Pilot Scoping Session</div>
        <div style={{ fontSize: 13, color: 'var(--muted)', lineHeight: 1.5 }}>
          A 20-minute call with an Acme solutions architect to walk through {companyName}'s plan.
        </div>
        <div style={{ marginTop: 20, paddingTop: 16, borderTop: '1px solid var(--rule)', fontSize: 13 }}>
          <div style={{ marginBottom: 8 }}>⏱ <strong>20 minutes</strong></div>
          <div style={{ marginBottom: 8 }}>📞 Google Meet</div>
          <div>🌐 Times shown in your timezone</div>
        </div>
      </div>
      <div style={{ padding: 20 }}>
        <div style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.18em', fontWeight: 700, color: 'var(--muted)', marginBottom: 14 }}>
          Select a day
        </div>
        <div className="calendly-day-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 8, marginBottom: 22 }}>
          {days.map((day, i) => (
            <button key={i} onClick={() => { setSelectedDay(i); setSelectedSlot(null); }}
              style={{
                padding: '10px 6px', cursor: 'pointer',
                background: selectedDay === i ? 'var(--ink)' : '#fff',
                color: selectedDay === i ? 'var(--cream)' : 'var(--ink)',
                border: '1px solid var(--ink)', textAlign: 'center',
              }}>
              <div style={{ fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.18em', opacity: 0.7, fontWeight: 600 }}>
                {day.toLocaleDateString('en-US', { weekday: 'short' })}
              </div>
              <div className="display" style={{ fontSize: 22, fontWeight: 500, marginTop: 2 }}>{day.getDate()}</div>
            </button>
          ))}
        </div>
        <div style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.18em', fontWeight: 700, color: 'var(--muted)', marginBottom: 14 }}>
          Available times
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 8, marginBottom: 16 }}>
          {slots[selectedDay].map((slot, i) => (
            <button key={i} onClick={() => setSelectedSlot(i)}
              style={{
                padding: 12, cursor: 'pointer', fontSize: 14, fontWeight: 600,
                background: selectedSlot === i ? 'var(--red)' : '#fff',
                color: selectedSlot === i ? '#fff' : 'var(--ink)',
                border: selectedSlot === i ? '1px solid var(--red)' : '1px solid var(--ink)',
              }}>
              {slot}
            </button>
          ))}
        </div>
        {selectedSlot !== null && (
          <button onClick={() => setConfirmed(true)} className="reveal-fast" style={{
            width: '100%', padding: 16, background: 'var(--ink)', color: 'var(--cream)',
            border: 'none', fontSize: 13, textTransform: 'uppercase', letterSpacing: '0.22em',
            fontWeight: 700, cursor: 'pointer',
          }}>
            Confirm booking →
          </button>
        )}
      </div>
    </div>
  );
}

  const day = today.getDay();
  const daysUntilThursday = (4 - day + 7) % 7 || 7;
  const next = new Date(today);

          </h2>
          <p style={{ marginTop: 28, fontSize: 16, lineHeight: 1.6, opacity: 0.8, maxWidth: 440 }}>
            Unlock the full plan, the share-ready PDF for your team, and a 20-minute scoping session with an <AcmeLogo size="0.95em" light style={{ verticalAlign: '-0.05em' }} /> solutions architect who'll tailor every detail for {companyName}.
          </p>
        </div>
        <div>
          <div style={{ display: 'grid', gap: 14 }}>
            <input type="text" value={contactName} onChange={e => setContactName(e.target.value)} placeholder="Your name"
              style={{ padding: '20px 22px', fontSize: 16, border: '1px solid var(--cream)', background: 'transparent', color: 'var(--cream)', outline: 'none' }} />
            <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="Work email"
              style={{ padding: '20px 22px', fontSize: 16, border: '1px solid var(--cream)', background: 'transparent', color: 'var(--cream)', outline: 'none' }} />
            <button onClick={submit} disabled={!ready || submitting}
              style={{
                padding: 24, background: ready ? 'var(--red)' : '#444',
                color: '#fff', border: 'none', fontSize: 14, textTransform: 'uppercase',
                letterSpacing: '0.22em', fontWeight: 700, cursor: ready ? 'pointer' : 'not-allowed',
              }}>
              {submitting ? 'Saving…' : 'Unlock & book a session →'}
            </button>
            <div style={{ fontSize: 12, opacity: 0.55, marginTop: 4 }}>
              By continuing you agree to be contacted by our solutions team.
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Unlocked({ companyName, reset }) {
  return (
    <div style={{ marginTop: 60, padding: 64, background: 'var(--cream)', border: '2px solid var(--ink)', textAlign: 'center' }}>
      <div style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.26em', color: 'var(--red)', fontWeight: 700 }}>◆ Plan unlocked</div>
      <h2 className="display" style={{ fontSize: 56, margin: '24px 0 0', lineHeight: 1, fontWeight: 400 }}>
        We'll be in touch, {companyName.split(' ')[0]}.
      </h2>
      <p style={{ marginTop: 18, fontSize: 16, color: '#4A4A4A' }}>
        An <AcmeLogo size="0.95em" /> solutions architect will reach out within one business day.
      </p>
      <button onClick={reset} style={{
        marginTop: 36, padding: '14px 30px', background: 'transparent',
        color: 'var(--ink)', border: '1.5px solid var(--ink)', fontSize: 13, textTransform: 'uppercase',
        letterSpacing: '0.18em', cursor: 'pointer', fontWeight: 700,
      }}>Model another company →</button>
    </div>
  );
}

function Footer() {
  return (
    <footer style={{ borderTop: '1px solid var(--ink)', marginTop: 0, padding: '40px 32px', background: 'var(--ink)', color: 'var(--cream)' }}>
      <div style={{ maxWidth: 1320, margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 12, opacity: 0.7 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <AcmeLogo size={18} light />
          <span style={{ width: 1, height: 16, background: 'rgba(248,246,242,0.3)' }} />
          <span style={{ textTransform: 'uppercase', letterSpacing: '0.18em', fontWeight: 600 }}>Acme Inbound Discovery Audit · Prototype</span>
        </div>
        <div style={{ textTransform: 'uppercase', letterSpacing: '0.18em', fontWeight: 600 }}>
          Modeled by Will Delehanty
        </div>
      </div>
    </footer>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
